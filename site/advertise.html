<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advertise — LostTimes</title>
<meta name="description" content="Reach Estonian runners, cyclists, triathletes and skiers in the hour after they finish a race.">
<link rel="canonical" href="https://losttimes.ee/advertise.html">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--ink:#13202B;--red:#FF4938;--slate:#66717D;--line:#E7EBED;
    --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:600px;margin:0 auto;padding:0 22px}
  .top{padding:26px 0 0}
  .logo{display:inline-block;font-weight:700;font-size:22px;letter-spacing:-.035em;
    line-height:1;text-decoration:none;color:var(--ink)}
  .logo i{color:var(--red);font-style:normal}
  h1{margin:48px 0 0;font-size:clamp(28px,7.5vw,38px);font-weight:700;
    letter-spacing:-.035em;line-height:1.08}
  p{margin:18px 0 0;font-size:17px;color:var(--slate);font-weight:500}
  .cta{display:inline-block;margin-top:30px;padding:13px 22px;border-radius:100px;
    background:var(--red);color:#fff;font-size:15.5px;font-weight:600;text-decoration:none}
  footer{margin-top:56px;padding:20px 0 44px;border-top:1px solid var(--line);
    color:var(--slate);font-size:13px}
  footer a{color:var(--ink);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="/">LOSTTIMES<i>.</i></a></div>

  <h1>Reach people who actually race.</h1>
  <p>Advertising on LostTimes is opening soon.</p>

  <a class="cta" href="mailto:info@losttimes.ee?subject=Advertising%20on%20LostTimes">Get in touch →</a>

  <footer><a href="/">Results</a> · <a href="/about.html">About</a></footer>
</div>
</body>
</html>
