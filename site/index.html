<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOSTTIMES — Eesti võistluste tulemused ühes kohas</title>
<meta name="description" content="Kõikide Eesti jooksu-, suusa-, ratta- ja triatlonivõistluste stardinimekirjad ja tulemused ühes kohas. Üks klikk õigele ajavõtulehele.">
<meta name="theme-color" content="#FFFFFF">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<!-- iPhone / iPad avaekraan -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LostTimes">

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF;
    --ink:#13202B;
    --red:#FF4938;
    --slate:#66717D;
    --line:#E7EBED;
    --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    font-family:var(--sans);
    color:var(--ink);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:0 22px}

  /* ---------- pais ---------- */
  .top{display:flex;align-items:flex-start;justify-content:space-between;padding:26px 0 0}
  .logo{font-weight:700;font-size:23px;letter-spacing:-.035em;line-height:1}
  .logo i{color:var(--red);font-style:normal}
  .tagline{
    margin-top:6px;font-size:9.5px;font-weight:600;
    letter-spacing:.155em;text-transform:uppercase;color:var(--ink);
  }
  .icons{display:flex;gap:6px;margin-top:-4px}
  .icons button{
    width:40px;height:40px;display:grid;place-items:center;
    background:none;border:0;cursor:pointer;color:var(--ink);
  }
  .icons button svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .icons button[aria-expanded="true"]{color:var(--red)}

  /* ---------- pealkiri ---------- */
  h1{
    margin:34px 0 0;font-size:clamp(34px,9.2vw,46px);font-weight:700;
    letter-spacing:-.038em;line-height:1.02;
  }
  /* Küsimärgi punkt punaseks — nagu ikoonil.
     Sama märk kaks korda kohakuti: all tavaline, peal punane koopia, millest
     on näha ainult alumine osa ehk punkt. Kui lõikekoht paistab veidi vale,
     on ainus number, mida nihutada, see 72% siin all. */
  .qm{position:relative;display:inline-block;line-height:1}
  .qm::after{
    content:'?';
    position:absolute;left:0;top:0;
    color:var(--red);
    clip-path:inset(72% 0 0 0);
  }
  .sub{margin:10px 0 0;font-size:clamp(20px,5.4vw,26px);font-weight:600;
    letter-spacing:-.03em;color:var(--red)}

  /* ---------- otsing ---------- */
  .searchbar{display:none;padding-top:18px}
  .searchbar.open{display:block}
  .searchbar input{
    width:100%;padding:12px 0;font-family:var(--sans);font-size:17px;font-weight:500;
    color:var(--ink);background:none;border:0;border-bottom:2px solid var(--ink);outline:none;
  }
  .searchbar input::placeholder{color:var(--slate);font-weight:500}

  /* ---------- filter ---------- */
  .filters{display:none;flex-wrap:wrap;gap:7px;padding-top:16px}
  .filters.open{display:flex}
  .filters button{
    font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.02em;
    padding:7px 12px;border-radius:100px;cursor:pointer;
    border:1px solid var(--line);background:none;color:var(--slate);
  }
  .filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  .filters .fsep{flex-basis:100%;height:4px}
  .filters .pagelink{
    font-size:13px;font-weight:600;letter-spacing:.02em;padding:7px 12px;
    border-radius:100px;border:1px solid transparent;color:var(--ink);
    text-decoration:none;
  }
  .filters .pagelink:hover{border-color:var(--line)}

  /* ---------- tabid ---------- */
  .tabs{display:flex;gap:30px;margin-top:30px;border-bottom:1px solid var(--line)}
  .tabs button{
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--slate);
    background:none;border:0;padding:0 0 13px;cursor:pointer;position:relative;
  }
  .tabs button[aria-selected="true"]{color:var(--red)}
  .tabs button[aria-selected="true"]::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);
  }

  /* ---------- nimekiri ---------- */
  .row{display:flex;gap:20px;padding:23px 0;border-bottom:1px solid var(--line)}
  .row .date{width:44px;flex:none;padding-top:2px}
  .row .day{font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1}
  .row .mon{margin-top:6px;font-size:10.5px;font-weight:500;letter-spacing:.11em;
    text-transform:uppercase;color:var(--slate)}
  .row .body{min-width:0;flex:1}
  .row h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
  .row .acts{margin-top:9px;font-size:14.5px;font-weight:500;display:flex;flex-wrap:wrap;
    align-items:center;gap:4px 9px}
  .row .acts a{text-decoration:none;font-weight:600;white-space:nowrap}
  .row .acts a.res{color:var(--red)}
  .row .acts a.other{color:var(--ink)}
  .row .acts a.live{color:#fff;background:var(--red);padding:2px 9px;border-radius:100px;
    font-size:12.5px;letter-spacing:.05em}
  .row .acts .sep{color:var(--line);font-weight:500}
  .row h2 a.title{text-decoration:none;color:inherit}
  .row h2 a.title:hover{text-decoration:underline;text-underline-offset:3px}
  .arr{font-size:.85em;display:inline-block;transform:translateY(-1px)}

  .empty{padding:64px 0;text-align:center;color:var(--slate);font-weight:500}
  footer{padding:36px 0 48px;color:var(--slate);font-size:12.5px;font-weight:500;line-height:1.65}
  footer strong{color:var(--ink);font-weight:600}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <div class="logo">LOSTTIMES<i>.</i></div>
      <div class="tagline">We know where they are.</div>
    </div>
    <div class="icons">
      <button id="btn-search" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button id="btn-filter" aria-label="Filter" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>

  <h1>Where the hell<br>are my results<span class="qm">?</span></h1>
  <p class="sub">Right here.</p>

  <div class="searchbar" id="searchbar">
    <input id="q" type="search" autocomplete="off" placeholder="Search a race…" aria-label="Search a race">
  </div>

  <div class="filters" id="filters"></div>

  <div class="tabs" role="tablist">
    <button id="tab-past" role="tab" aria-selected="true">Results</button>
    <button id="tab-next" role="tab" aria-selected="false">Upcoming</button>
  </div>
</div>

<main class="wrap" id="list"><div class="empty">Loading…</div></main>

<footer class="wrap">
  <p><strong>We don't host results. We just know where they are.</strong><br>
     Every link takes you to the timekeeper's own page — ChampionChip, Sportos, Estoloppet,
     Antrotsenter, TolkNet or the organiser.</p>
  <p id="stamp"></p>
</footer>

<script>
// Service workerit siin meelega EI OLE.
//
// Ta oleks hoidnud lehe telefonis, aga tulemused elavad niikuinii ajavõtjate
// serverites — ilma võrguta ei näe neid keegi. Vastu oleks saanud uue viisi,
// kuidas asjad katki lähevad: vana leht jääb vahemällu kinni ja kasutaja ei
// saa aru, miks andmed ei uuene. Ikoon avaekraanil töötab ka ilma selleta.

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const ARROW = '<span class="arr">↗</span>';
const state = {
  events: [],      // laetud võistlused (kasvab, kui aastaid juurde laetakse)
  meta: null,      // index.json — mis aastaid üldse olemas on
  loaded: new Set(),
  tab: 'past', q: '', year: null, loading: false,
};
const today = new Date().toISOString().slice(0, 10);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function actions(e){
  const out = [];
  for (const s of e.sources){
    if (s.links.live)
      out.push(`<a class="live" href="${s.links.live}" target="_blank" rel="noopener">LIVE</a>`);
  }
  // "Results" tähendab ainult üht asja: otselink tulemustele. Kui meil seda
  // ei ole, siis me seda sõna ei kasuta — pakume ausalt otsingut.
  const res = e.sources.find(s => s.links.results);
  if (res){
    out.push(`<a class="res" href="${res.links.results}" target="_blank" rel="noopener">Results ${ARROW}</a>`);
  } else if (e.date <= today){
    const q = encodeURIComponent(`${e.name} ${e.date.slice(0,4)} tulemused`);
    out.push(`<a class="other" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Search ${ARROW}</a>`);
  }
  const start = e.sources.find(s => s.links.startlist && s.links.startlist !== (res && res.links.results));
  if (start){
    if (out.length) out.push('<span class="sep">·</span>');
    out.push(`<a class="other" href="${start.links.startlist}" target="_blank" rel="noopener">Start list ${ARROW}</a>`);
  }

  // Tulevasel võistlusel, millel veel stardinimekirja ega tulemusi pole,
  // anname vähemalt korraldaja lingi — muidu jääks rida tühjaks.
  if (!out.length){
    const org = e.sources.find(s => s.links.organiser) || e.sources.find(s => s.links.info);
    const url = org && (org.links.organiser || org.links.info);
    if (url) out.push(`<a class="other" href="${url}" target="_blank" rel="noopener">Organiser ${ARROW}</a>`);
  }
  return out.join('');
}

// Võistluse nimi on link ta enda infolehele — korraldaja koduleht, kui see
// on teada, muidu ajavõtja ürituseleht. Kui kumbagi pole, jääb tavaline tekst.
// NB: eelistame "info" linki, mitte korraldaja oma. Sportos annab korraldajaks
// tihti lihtsalt kodulehe juure (tartu.ee, pyhajarve.com), mis ei ütle selle
// konkreetse võistluse kohta midagi. Info-link viib alati just sellele
// võistlusele — see on see, mida inimene tegelikult tahab.
function nameHtml(e){
  const stage = e.sources.find(s => s.id === 'organiser' && s.links.info);
  const info = e.sources.find(s => s.links.info);
  const org = e.sources.find(s => s.links.organiser);
  const url = (stage && stage.links.info)
    || (info && info.links.info)
    || (org && org.links.organiser);
  const name = esc(e.name);
  return url
    ? `<a class="title" href="${url}" target="_blank" rel="noopener">${name}</a>`
    : name;
}

// --- arhiivi laadimine aastate kaupa ---------------------------------------

// --- otsing ----------------------------------------------------------------

// "Pühajärve" -> "puhajarve". Eestlane trükib telefonis tihti täpitähtedeta,
// ja võistluste nimed on täpitähti täis. Ilma selleta ei leiaks pool asju.
const fold = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// Levenshtein, aga peatume niipea kui vahe on üle lubatud piiri.
function closeEnough(word, target, max){
  if (Math.abs(word.length - target.length) > max) return false;
  let prev = Array.from({ length: target.length + 1 }, (_, i) => i);
  for (let i = 1; i <= word.length; i++){
    const row = [i];
    let best = i;
    for (let j = 1; j <= target.length; j++){
      row[j] = Math.min(
        prev[j] + 1,
        row[j-1] + 1,
        prev[j-1] + (word[i-1] === target[j-1] ? 0 : 1)
      );
      if (row[j] < best) best = row[j];
    }
    if (best > max) return false;
    prev = row;
  }
  return prev[target.length] <= max;
}

function matches(e, terms){
  // 1. Kõik sõnad peavad esinema — järjekord ei loe.
  //    Nii leiab "tartu maraton" ka kirje "52. Maraton Tartus".
  if (terms.every(t => e._s.includes(t))) return true;

  // 2. Kui ei leidnud, lubame ühe näpuvea sõna kohta. Ainult pikematel
  //    sõnadel, muidu hakkab lühikest juppi liiga paljuga sobitama.
  return terms.every(t => {
    if (t.length < 5) return e._s.includes(t);
    return e._w.some(w => closeEnough(t, w, 1));
  });
}

// --- arhiivi laadimine aastate kaupa ---------------------------------------

async function loadYear(year){
  if (state.loaded.has(year)) return;
  state.loaded.add(year);
  const res = await fetch(`events-${year}.json`);
  if (!res.ok) return;
  const rows = await res.json();
  for (const e of rows){
    e._s = fold(`${e.name} ${e.location||''} ${e.sport||''}`);
    e._w = e._s.split(/[^a-z0-9]+/).filter(w => w.length > 2);
  }
  state.events = state.events.concat(rows);
  state.events.sort((a,b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
}

// Otsing peab käima üle kogu ajaloo, mitte ainult selle, mis juhtub laetud olema.
async function loadAllYears(){
  if (!state.meta) return;
  const missing = state.meta.years.map(y => y.year).filter(y => !state.loaded.has(y));
  if (!missing.length) return;
  state.loading = true;
  render();
  await Promise.all(missing.map(loadYear));
  state.loading = false;
  buildFilters();
}

function render(){
  const list = document.getElementById('list');
  const terms = fold(state.q).split(/\s+/).filter(Boolean);

  let rows = state.events.filter(e => {
    if (state.year && !e.date.startsWith(state.year)) return false;
    if (terms.length) return matches(e, terms);
    if (state.year) return true;   // aastat vaadates näita kõike, ka tulevast
    return state.tab === 'past' ? e.date <= today : e.date > today;
  });
  const q = terms.length ? state.q : '';
  if (state.tab === 'next' && !q && !state.year) rows = rows.slice().reverse();

  if (!rows.length){
    list.innerHTML = `<div class="empty">${
      state.loading ? 'Searching the archive…' : (q ? 'Nothing found.' : 'Nothing here yet.')
    }</div>`;
    return;
  }

  list.innerHTML = rows.slice(0, 300).map(e => {
    const d = new Date(e.date + 'T12:00:00');
    return `<article class="row">
      <div class="date">
        <div class="day">${String(d.getDate()).padStart(2,'0')}</div>
        <div class="mon">${MONTHS[d.getMonth()]}</div>
      </div>
      <div class="body">
        <h2>${nameHtml(e)}</h2>
        <div class="acts">${actions(e)}</div>
      </div>
    </article>`;
  }).join('');
}

// Menüüs on ainult aastad.
//
// Siin olid varem ka spordialad, aga need tulid andmetest eestikeelsena
// ("Maanteerattasõit") keset ingliskeelset liidest — ja keegi ei otsi tulemusi
// ala järgi. Sa tead, mis võistlusel sa käisid. Ala jääb otsingusse sisse,
// nii et "triatlon" kirjutades leiab ikka.
// Kui suur osa aasta võistlustest peab olema päris tulemuste lingiga, et seda
// aastat üldse sirvimiseks pakkuda. Vana aasta, kus kaks kolmandikku ridadest
// viivad Google'i otsingusse, näeb kasutaja silmis katkine välja — parem seda
// mitte pakkuda kui pakkuda halvasti.
//
// NB: see EI PEIDA midagi otsingu eest. Otsing käib alati üle kogu arhiivi,
// nii et 2016. aasta võistlus on nime järgi ikka leitav. Kuratud on ainult
// sirvimine, mitte sisu.
const YEAR_MIN_COVERAGE = 0.5;
const YEAR_MIN_EVENTS = 20;

function buildFilters(){
  const box = document.getElementById('filters');
  const all = state.meta ? state.meta.years : [];
  const years = all
    .filter(y => {
      if (y.withResults === undefined) return true;   // vana index.json
      if (y.count < YEAR_MIN_EVENTS) return false;
      return y.withResults / y.count >= YEAR_MIN_COVERAGE;
    })
    .map(y => y.year);

  box.innerHTML =
    years.map(y => `<button data-year="${y}" aria-pressed="${state.year === y}">${y}</button>`).join('') +
    '<span class="fsep"></span>' +
    '<a class="pagelink" href="/about.html">About</a>' +
    '<a class="pagelink" href="/advertise.html">Advertise</a>' +
    '<a class="pagelink" href="mailto:info@losttimes.ee?subject=LostTimes">Contact</a>';

  box.querySelectorAll('button[data-year]').forEach(b => b.addEventListener('click', async () => {
    const year = b.dataset.year;
    state.year = state.year === year ? null : year;
    if (state.year){ state.loading = true; render(); await loadYear(state.year); state.loading = false; }
    buildFilters();
    render();
  }));
}

function toggle(btnId, boxId, onOpen){
  const btn = document.getElementById(btnId), box = document.getElementById(boxId);
  btn.addEventListener('click', () => {
    const open = box.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    if (open && onOpen) onOpen();
  });
}
toggle('btn-search', 'searchbar', () => document.getElementById('q').focus());
toggle('btn-filter', 'filters');

const qEl = document.getElementById('q');

// Otsingu sulgemine: väli tühjaks, riba kinni, nimekiri tagasi.
function closeSearch(){
  qEl.value = '';
  state.q = '';
  document.getElementById('searchbar').classList.remove('open');
  document.getElementById('btn-search').setAttribute('aria-expanded', 'false');
  qEl.blur();
  render();
}

// Esimene otsingutäht laeb kogu arhiivi taustal — pärast seda on otsing kohene.
let searchLoaded = false;
qEl.addEventListener('input', async ev => {
  state.q = ev.target.value;
  render();
  if (!searchLoaded && state.q.trim()){
    searchLoaded = true;
    await loadAllYears();
    render();
  }
});

// Ristike välja sees tekitab "search" sündmuse. Kui väli jäi tühjaks, on
// kasutaja otsingu lõpetanud — paneme riba kinni, mitte ei jäta tühjalt ette.
// NB: Enter tekitab sama sündmuse, aga siis on väljal tekst ja me ei sulge.
qEl.addEventListener('search', () => { if (!qEl.value) closeSearch(); });
qEl.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSearch(); });
for (const [id, tab] of [['tab-past','past'], ['tab-next','next']]){
  document.getElementById(id).addEventListener('click', () => {
    state.tab = tab;
    state.year = null;
    document.getElementById('tab-past').setAttribute('aria-selected', tab === 'past');
    document.getElementById('tab-next').setAttribute('aria-selected', tab === 'next');
    buildFilters();
    render();
  });
}

(async () => {
  try {
    state.meta = await (await fetch('index.json')).json();
  } catch {
    document.getElementById('list').innerHTML =
      '<div class="empty">No data. Run npm run scrape first.</div>';
    return;
  }

  // Laeme jooksva aasta kohe. Kui aasta on alles alanud ja kirjeid on vähe,
  // võtame eelmise ka — muidu oleks jaanuaris leht peaaegu tühi.
  const years = state.meta.years.map(y => y.year);
  const thisYear = String(new Date().getFullYear());
  const first = years.includes(thisYear) ? thisYear : years[0];
  await loadYear(first);
  if (state.events.length < 60 && years[years.indexOf(first) + 1]) {
    await loadYear(years[years.indexOf(first) + 1]);
  }

  const d = new Date(state.meta.generated);
  const span = years.length ? `${years[years.length - 1]}–${years[0]}` : '';
  document.getElementById('stamp').textContent =
    `Updated ${d.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })} · `
    + `${state.meta.total} races · ${span}`;

  buildFilters();
  render();
})();
</script>
</body>
</html>
