name: Uuenda võistluste nimekirja

on:
  schedule:
    - cron: '0 3 * * *'   # iga öö kell 03:00 UTC (06:00 Eesti aeg)
  workflow_dispatch:       # ja käsitsi nupust, kui vaja

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci || npm install

      - name: Scrape
        run: npm run scrape

      - name: Commit muudatused
        run: |
          git config user.name  "wheresmytime-bot"
          git config user.email "bot@users.noreply.github.com"
          # Kogu site/, mitte ainult andmefailid.
          #
          # Varem lisati siia ainult index.json ja events-*.json. Nimekiri
          # uuenes, aga genereeritud lehed mitte — uue voistluse /race/ lehte
          # ei olnud olemas ja "Results" nupp andis 404, sest lingita
          # voistlusel viitab see nupp just sellele lehele. Ka sitemap jai
          # vanaks, nii et Google ei saanud uutest lehtedest teada enne
          # jargmist kasitsi jooksu.
          #
          # Git lisab ainult tegelikult muutunud failid, nii et ooine commit
          # jaab vaikeseks ka siis, kui kaustas on 4000 lehte.
          git add site data/cache.json
          git diff --staged --quiet || git commit -m "Andmed uuendatud $(date -u +%Y-%m-%d)"
          git push
