name: Uuenda võistluste nimekirja

on:
  schedule:
    - cron: '0 3 * * *'   # iga öö kell 03:00 UTC (06:00 Eesti aeg)
  workflow_dispatch:       # ja käsitsi nupust, kui vaja

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci || npm install

      - name: Scrape
        run: npm run scrape

      - name: Commit muudatused
        run: |
          git config user.name  "wheresmytime-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/events.json
          git diff --staged --quiet || git commit -m "Andmed uuendatud $(date -u +%Y-%m-%d)"
          git push
